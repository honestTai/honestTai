name: Refresh public portfolio
on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-portfolio-metrics
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test the metrics renderer
        run: python3 -m unittest discover -s tests -v
      - name: Collect public data and render local SVGs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_metrics.py
      - name: Commit generated portfolio assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md README.zh-CN.md assets/overview.svg assets/metrics assets/badges data/latest.json data/daily.json data/README.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore(metrics): refresh public repository snapshots'
            git push
          fi
